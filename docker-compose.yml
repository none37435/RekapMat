version: '3.8'

services:
  rekap-material:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekap-material-app
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
